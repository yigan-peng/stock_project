<!-- HTML文档声明 -->
<!DOCTYPE html>
<html lang="zh-CN">                     <!-- 中文语言 -->
<head>
<meta charset="UTF-8">                   <!-- 字符编码UTF-8 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">  <!-- 移动端适配：禁止缩放 -->
<title>行业资金流向</title>               <!-- 页面标题 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>  <!-- 引入ECharts图表库（CDN） -->
<style>
/* ===== 全局重置：清除默认边距 ===== */
*{margin:0;padding:0;box-sizing:border-box}  /* 所有元素：0边距，边框计入宽高 */
/* ===== 页面主体：深色背景，全屏高度，纵向弹性布局 ===== */
body{background:#0d1117;height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
/* ===== 顶部工具栏：水平排列按钮和状态 ===== */
.hdr{padding:6px 14px;display:flex;align-items:center;gap:10px;color:#c9d1d9;font-size:14px;flex-shrink:0;flex-wrap:wrap}
/* ===== 按钮基础样式 ===== */
.hdr button{color:#fff;border:none;border-radius:4px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
/* ===== 按钮禁用样式：半透明+禁止光标 ===== */
.hdr button:disabled{opacity:0.5;cursor:not-allowed}
/* ===== 三种按钮颜色 ===== */
.btn-green{background:#238636}           /* 绿色：确认/更新操作 */
.btn-red{background:#da3633}             /* 红色：停止/危险操作 */
.btn-blue{background:#1f6feb}            /* 蓝色：启动/信息操作 */
/* ===== 分隔线（按钮组之间的竖线） ===== */
.hdr .sep{width:1px;height:20px;background:#30363d}
/* ===== 状态文字样式（小字灰色） ===== */
.st{font-size:10px;color:#8b949e}
/* ===== Tab切换栏 ===== */
.tabs{display:flex;gap:0;flex-shrink:0;border-bottom:2px solid #21262d}
/* ===== 单个Tab按钮样式 ===== */
.tab{padding:8px 24px;font-size:13px;color:#8b949e;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
/* ===== Tab选中样式 ===== */
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff;font-weight:600}
/* ===== Tab悬浮效果 ===== */
.tab:hover{color:#c9d1d9}
/* ===== 图表容器：占据全部剩余空间 ===== */
.chart-wrap{flex:1;position:relative;min-height:0;display:none}  /* 默认隐藏 */
/* ===== 图表容器激活时显示 ===== */
.chart-wrap.active{display:block}  /* 激活时显示 */
/* ===== 图表标题（左上角悬浮文字） ===== */
.chart-title{position:absolute;top:4px;left:14px;color:#8b949e;font-size:11px;z-index:1}
/* ===== 时间范围选择按钮样式 ===== */
.range-btn{background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:3px;padding:2px 8px;font-size:10px;cursor:pointer;transition:all .2s}
.range-btn:hover{background:#30363d;color:#c9d1d9}
.range-btn.active{background:#1f6feb;color:#fff;border-color:#1f6feb}
</style>
</head>
<body>
<!-- ===== 顶部工具栏区域 ===== -->
<div class="hdr">
  <span>📊 行业资金流向</span>          <!-- 页面标题文字 -->
  <!-- 按钮2：刷新分时数据（蓝色） -->
  <button id="btnRefreshIntraday" class="btn-blue" onclick="doRefreshIntraday()">🔄 刷新分时数据</button>
  <!-- 按钮3：将分时数据合并到每日（绿色） -->
  <button id="btnMerge" class="btn-green" onclick="doMergeIntraday()">🔀 将分时数据更新到每日</button>
  <div class="sep"></div>               <!-- 竖线分隔 -->
  <!-- 状态显示文字 -->
  <span class="st" id="stDaily">每日: 加载中…</span>     <!-- 每日数据状态 -->
  <span class="st" id="stIntraday">分时: 加载中…</span>  <!-- 分时数据状态 -->
</div>
<!-- ===== Tab切换栏 ===== -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('daily')">📈 每日净流入</div>   <!-- Tab1：每日图表 -->
  <div class="tab" onclick="switchTab('intraday')">📉 当天分时</div>         <!-- Tab2：分时图表 -->
</div>
<!-- ===== 图表1：每日净流入 ===== -->
<div class="chart-wrap active" id="dailyWrap">
  <div class="chart-title" id="dailyChartTitle">每日净流入(亿元) · 近1个月</div>
  <!-- 时间范围选择按钮组（移到工具栏下方） -->
  <div id="rangeBtnWrap" style="position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;background:#161b22;padding:6px 12px;border-radius:6px;border:1px solid #30363d;">
    <button class="range-btn active" data-days="30">近1月</button>
    <button class="range-btn" data-days="60">近2月</button>
    <button class="range-btn" data-days="90">近3月</button>
    <button class="range-btn" data-days="180">近半年</button>
    <button class="range-btn" data-days="365">近1年</button>
    <button class="range-btn" data-days="730">近2年</button>
    <button class="range-btn" data-days="1095">近3年</button>
  </div>
  <label style="position:absolute;top:4px;right:80px;z-index:2;color:#8b949e;font-size:11px;cursor:pointer">
    <input type="checkbox" id="selectAllDaily" checked> 全选
  </label>
  <div id="chartDaily" style="width:100%;height:100%"></div>
</div>
<!-- ===== 图表2：当天分时净流入 ===== -->
<div class="chart-wrap" id="intradayWrap">
  <div class="chart-title">当天分时净流入(亿元)</div>
  <label style="position:absolute;top:4px;right:80px;z-index:2;color:#8b949e;font-size:11px;cursor:pointer">
    <input type="checkbox" id="selectAllIntraday" checked> 全选
  </label>
  <div id="chartIntraday" style="width:100%;height:100%"></div>
</div>

<script>
// ==================== 初始化图表实例 ====================
// 获取DOM元素并创建ECharts实例（每个div一个独立图表）
const chartDaily = echarts.init(document.getElementById('chartDaily'));      // 每日图表
const chartIntraday = echarts.init(document.getElementById('chartIntraday')); // 分时图表

// ==================== 获取DOM元素引用 ====================
const stDaily = document.getElementById('stDaily');       // 每日状态文字元素
const stIntraday = document.getElementById('stIntraday'); // 分时状态文字元素
const btnRefreshIntraday = document.getElementById('btnRefreshIntraday'); // 分时刷新按钮

// ==================== 20种颜色（循环使用给20个行业） ====================
// const C=['#f23645','#ff7549','#ffa657','#53b483','#2b908f',  // 红/橙/绿/青系列
//          '#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef',  // 蓝/紫系列
//          '#06b6d4','#84cc16','#fbbf24','#fb923c','#34d399',  // 青/黄/绿系列
//          '#e879f9','#38bdf8','#a3e635','#fb7185','#818cf8']; // 粉/蓝/绿系列
const C = Array.from({length: 92}, (_, i) => {
    const hue = (i * 358 / 89) % 359;
    return `hsl(${hue}, 72%, 56%)`;
});

// ==================== Y轴固定范围（亿元） ====================
const Y_MIN = -300;  // Y轴下限
const Y_MAX = 430;   // Y轴上限


// ==================== Tab切换逻辑 ====================
/**
 * 切换每日/分时图表页面
 * name: 'daily' 或 'intraday'
 */
function switchTab(name) {
  // 更新Tab按钮样式
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));  // 移除所有active
  const tabs = document.querySelectorAll('.tab');  // 获取所有tab
  if (name === 'daily') tabs[0].classList.add('active');   // 激活第一个tab
  else tabs[1].classList.add('active');                     // 激活第二个tab
  // 更新图表容器显示
  document.querySelectorAll('.chart-wrap').forEach(w => w.classList.remove('active'));  // 隐藏所有图表
  if (name === 'daily') document.getElementById('dailyWrap').classList.add('active');  // 显示每日图表
  else document.getElementById('intradayWrap').classList.add('active');                 // 显示分时图表
  // 切换后需要resize图表（ECharts需要重新计算尺寸）
  setTimeout(() => { chartDaily.resize(); chartIntraday.resize(); }, 50);
}

// ==================== 通用图表配置生成 ====================
/**
 * 根据数据生成ECharts配置项
 * res: API返回的数据对象 {date, time_points, sectors}
 * yName: Y轴名称（如"净流入(亿元)"）
 * 返回: ECharts option对象 或 null（无数据时）
 */
function makeOption(res, yName) {
  if (!res || res.error || !res.sectors || res.sectors.length===0) return null;
  return {
    backgroundColor: '#0d1117',
    tooltip: {trigger:'axis', backgroundColor:'#1c2333', borderColor:'#30363d',
              textStyle:{color:'#c9d1d9',fontSize:11},
              enterable:true,
              confine:true,
              formatter: function(params) {
                if (!params || params.length === 0) return '';
                var title = '<b style="color:#58a6ff">' + params[0].axisValue + '</b><br>';
                var items = params.map(function(p) {
                  var val = Array.isArray(p.value) ? p.value[1] : p.value;
                  var sign = val > 0 ? '+' : '';
                  return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + p.color + ';margin-right:4px;vertical-align:middle"></span>' +
                    p.seriesName + ': ' + sign + Number(val).toFixed(2) + '<br>';
                }).join('');
                return '<div style="max-height:180px;overflow-y:auto;">' + title + items + '</div>';
              }},
    legend: {data: res.sectors.map(s=>s.name), textStyle:{color:'#8b949e',fontSize:10},
             top:28, right:16, type:'scroll', icon:'circle', itemWidth:8, itemHeight:8, itemGap:10},
    grid: {left:'16px',right:'16px',bottom:'16px',top:68,containLabel:true},
    xAxis: {type:'category', data:res.time_points,
            axisLine:{lineStyle:{color:'#30363d'}}, axisLabel:{color:'#8b949e',fontSize:10}},
    yAxis: {type:'value', name:yName, min:Y_MIN, max:Y_MAX,
            nameTextStyle:{color:'#8b949e',fontSize:10},
            axisLine:{lineStyle:{color:'#30363d'}}, axisLabel:{color:'#8b949e',fontSize:10},
            splitLine:{lineStyle:{color:'#21262d'}}},
    series: res.sectors.map((s,i)=>({
      name:s.name,
      type:'line',
      smooth:true,
      symbol:'circle',
      symbolSize:4,
      lineStyle:{width:1.5,color:C[i%C.length]},
      itemStyle:{color:C[i%C.length]},
      connectNulls: true,
      data: s.values.map((v,t)=>[res.time_points[t], v])
    }))
  };
}

// ==================== 渲染每日图表 ====================
function renderDaily(res) {
  if (res.error) { stDaily.textContent = '每日: ' + res.error; return; }
  
  // 根据 deleted_dates 剔除被删除的日期
  // 只剔除那些被用户主动删除的日期，其他日期（包括值为0的正常日期）保留
  const deletedSet = new Set(res.deleted_dates || []);
  
  // 找出需要保留的日期索引
  const validIndices = [];
  for (let t = 0; t < res.time_points.length; t++) {
    const dateStr = res.time_points[t];
    // 只剔除被标记为已删除的日期
    if (!deletedSet.has(dateStr)) {
      validIndices.push(t);
    }
  }
  
  // 构建过滤后的数据
  const filteredRes = {
    date: res.date,
    time_points: validIndices.map(i => res.time_points[i]),
    sectors: res.sectors.map(s => ({
      name: s.name,
      values: validIndices.map(i => s.values[i])
    }))
  };
  
  stDaily.textContent = '每日: ' + filteredRes.date + ' (' + filteredRes.time_points.length + '天)';
  
  const opt = makeOption(filteredRes, '净流入(亿元)');
  if (opt) {
    chartDaily.setOption(opt, true);
    bindSelectAll(chartDaily, 'selectAllDaily');
  }
}

// ==================== 渲染分时图表 ====================
/**
 * 将API返回的分时数据渲染到分时图表
 * res: {date, time_points: ["10:03",...], sectors: [{name, values},...]}
 */
function renderIntraday(res, animate) {
  if (!res || res.error) { stIntraday.textContent = '分时: 暂无数据'; return; }
  // 计算已采集的点数（第一个行业中非零值的个数）
  const filled = res.sectors && res.sectors.length > 0
    ? res.sectors[0].values.filter(v => v !== 0).length : 0;
  // 更新状态文字：显示采集进度
  stIntraday.textContent = `分时: ${filled} 点已采集`;
  const opt = makeOption(res, '净流入(亿元)');  // 生成图表配置
  if (!opt) return;
  if (animate) {
    // 动画重绘：逐步画出曲线，从左到右慢慢展开
    _intradayAnimating = true;                     // 标记动画进行中
    chartIntraday.clear();                         // 彻底清空图表
    // 先设置完整配置（坐标轴、图例等），数据为空
    const emptyOpt = JSON.parse(JSON.stringify(opt));  // 深拷贝
    emptyOpt.series = opt.series.map(s => ({...s, data: []}));  // 清空数据
    chartIntraday.setOption(emptyOpt, true);         // 设置框架（不合并）
    const totalPoints = res.time_points.length;    // 总点数
    const duration = 5000;                         // 5秒画完
    const interval = 50;                           // 每50ms画一批
    const batchSize = Math.max(1, Math.ceil(totalPoints / (duration / interval)));  // 每批画几个点
    let currentIdx = 0;                            // 当前画到第几个点
    const timer = setInterval(() => {
      currentIdx += batchSize;                     // 前进一批
      if (currentIdx >= totalPoints) {
        currentIdx = totalPoints;                  // 画完全部
        clearInterval(timer);                      // 停止定时器
        _intradayAnimating = false;                // 标记动画结束
        bindSelectAll(chartIntraday, 'selectAllIntraday');
      }
      // 只更新series数据（合并模式，不影响坐标轴）
      const seriesUpdate = res.sectors.map((s, i) => ({
        data: s.values.slice(0, currentIdx).map((v, t) => [res.time_points[t], v])
      }));
      chartIntraday.setOption({series: seriesUpdate}, false);  // 合并模式更新
    }, interval);
  } else {
    chartIntraday.setOption(opt, true);              // 替换模式渲染
    chartIntraday.resize();
    bindSelectAll(chartIntraday, 'selectAllIntraday');
  }
}

let _intradayAnimating = false;  // 分时动画进行中标志

function bindSelectAll(chart, checkboxId) {
  const checkbox = document.getElementById(checkboxId);
  if (!checkbox) return;
  
  checkbox.addEventListener('change', function() {
    if (this.checked) {
      chart.dispatchAction({ type: 'legendSelectAll' });
    } else {
      chart.dispatchAction({ type: 'legendInverseSelect' });
    }
  });
  
  chart.on('legendselectchanged', function() {
    const option = chart.getOption();
    const legend = option.legend && option.legend[0];
    if (!legend || !legend.selected) return;
    const selected = legend.selected;
    const allSelected = Object.values(selected).every(v => v === true);
    checkbox.checked = allSelected;
  });
}
// ==================== 按钮操作：刷新分时数据 ====================
/**
 * 点击“🔄 刷新分时数据”按钮触发
 * 重新读取数据库并更新当前时间点的资金净流入
 */
function doRefreshIntraday() {
  if (_intradayAnimating) {                         // 动画进行中
    stIntraday.textContent = '分时: 正在更新中...';  // 提示
    return;                                         // 不做任何处理
  }
  btnRefreshIntraday.disabled = true;               // 禁用按钮
  stIntraday.textContent = '分时: 刷新中...';
  switchTab('intraday');                             // 自动切换到分时Tab
  fetch('/api/intraday/refresh', {method:'POST'})   // POST请求刷新API
    .then(r=>r.json())
    .then(j=>{
      if (j.error) { stIntraday.textContent = '分时: ' + j.error; return; }
      renderIntraday(j, true);                       // 渲染图表（带动画）
      stIntraday.textContent = '分时: 已刷新 (' + j.time_points.length + '点)';
    })
    .catch(e=>{stIntraday.textContent='分时: 请求失败'})
    .finally(()=>btnRefreshIntraday.disabled=false);
}

// ==================== 按钮操作：将分时数据合并到每日 ====================
/**
 * 点击"🔀 将分时数据合并到每日"按钮触发
 * 将分时最新数据滑入每日数据（丢弃最远一天）
 */
function doMergeIntraday() {
  const btn = document.getElementById('btnMerge');  // 获取合并按钮
  btn.disabled = true;                              // 禁用按钮
  stDaily.textContent = '每日: 合并中...';          // 显示合并状态
  fetch('/api/daily/merge_intraday', {method:'POST'})  // POST请求合并API
    .then(r=>r.json())
    .then(j=>{
      if (j.error) {                                // 合并失败
        stDaily.textContent = '每日: ' + j.error;
      } else {                                      // 合并成功
        renderDaily(j);                             // 渲染更新后的每日图表
        stDaily.textContent = '每日: 已合并分时数据 (' + j.time_points.length + '天)';
      }
    })
    .catch(e=>{stDaily.textContent='每日: 合并失败'})  // 网络错误
    .finally(()=>btn.disabled=false);               // 恢复按钮
}

// ==================== 当前选中的时间范围（默认30天） ====================
let currentDays = 30;

// ==================== 加载指定天数的每日数据 ====================
function loadDailyData(days) {
  currentDays = days;
  stDaily.textContent = '每日: 加载中...';
  fetch(`/api/daily/history/${days}`)
    .then(r => r.json())
    .then(j => {
      renderDaily(j);
      // 更新图表标题
      const titleMap = {30:'近1个月',60:'近2个月',90:'近3个月',180:'近半年',365:'近1年',730:'近2年',1095:'近3年'};
      document.getElementById('dailyChartTitle').textContent = '每日净流入(亿元) · ' + (titleMap[days] || days+'天');
    })
    .catch(e => { stDaily.textContent = '每日: 加载失败'; });
}

// ==================== 时间范围按钮点击事件 ====================
document.querySelectorAll('.range-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    // 更新按钮样式
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    // 加载对应天数的数据
    const days = parseInt(this.dataset.days);
    loadDailyData(days);
  });
});

// ==================== 页面初始加载 ====================
// 加载每日数据并渲染（默认30天）
loadDailyData(30);
// 加载分时数据并渲染
fetch('/api/intraday/history').then(r=>r.json()).then(renderIntraday);

// ==================== 分时数据每60秒自动刷新 ====================
setInterval(() => {
  fetch('/api/intraday/history').then(r=>r.json()).then(renderIntraday);
}, 60000);  // 每60秒刷新一次分时数据

// ==================== 窗口大小变化时自适应 ====================
// 浏览器窗口大小改变时重新计算图表尺寸
window.addEventListener('resize', ()=>{ chartDaily.resize(); chartIntraday.resize(); });

// ==================== 每日图表双击删除节点 ====================
chartDaily.on('dblclick', function(params) {
    if (!params || !params.data) return;
    const pointDate = params.name;
    
    if (!confirm(`确定要删除 ${pointDate} 这一天的数据吗？删除后将永久消失。`)) {
        return;
    }
    
    fetch(`/api/daily/delete_point?date=${encodeURIComponent(pointDate)}`)
    .then(r => {
        if (!r.ok) {
            return r.json().then(j => { throw new Error(j.error || '删除失败'); });
        }
        return r.json();
    })
    .then(j => {
        renderDaily(j);
        stDaily.textContent = '每日: 已删除 ' + pointDate + ' 的数据';
    })
    .catch(e => {
        alert('删除失败: ' + e.message);
    });
});

</script>
</body>
</html>
