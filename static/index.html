<!-- HTML文档声明 -->
<!DOCTYPE html>
<html lang="zh-CN">                     <!-- 中文语言 -->
<head>
<meta charset="UTF-8">                   <!-- 字符编码UTF-8 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">  <!-- 移动端适配：禁止缩放 -->
<title>行业资金流向</title>               <!-- 页面标题 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>  <!-- 引入ECharts图表库（CDN） -->
<style>
/* ===== 全局重置：清除默认边距 ===== */
*{margin:0;padding:0;box-sizing:border-box}  /* 所有元素：0边距，边框计入宽高 */
/* ===== 页面主体：深色背景，全屏高度，纵向弹性布局 ===== */
body{background:#0d1117;height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
/* ===== 顶部工具栏：水平排列按钮和状态 ===== */
.hdr{padding:6px 14px;display:flex;align-items:center;gap:10px;color:#c9d1d9;font-size:14px;flex-shrink:0;flex-wrap:wrap}
/* ===== 按钮基础样式 ===== */
.hdr button{color:#fff;border:none;border-radius:4px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
/* ===== 按钮禁用样式：半透明+禁止光标 ===== */
.hdr button:disabled{opacity:0.5;cursor:not-allowed}
/* ===== 三种按钮颜色 ===== */
.btn-green{background:#238636}           /* 绿色：确认/更新操作 */
.btn-red{background:#da3633}             /* 红色：停止/危险操作 */
.btn-blue{background:#1f6feb}            /* 蓝色：启动/信息操作 */
/* ===== 分隔线（按钮组之间的竖线） ===== */
.hdr .sep{width:1px;height:20px;background:#30363d}
/* ===== 状态文字样式（小字灰色） ===== */
.st{font-size:10px;color:#8b949e}
/* ===== Tab切换栏 ===== */
.tabs{display:flex;gap:0;flex-shrink:0;border-bottom:2px solid #21262d}
/* ===== 单个Tab按钮样式 ===== */
.tab{padding:8px 24px;font-size:13px;color:#8b949e;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
/* ===== Tab选中样式 ===== */
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff;font-weight:600}
/* ===== Tab悬浮效果 ===== */
.tab:hover{color:#c9d1d9}
/* ===== 图表容器：占据全部剩余空间 ===== */
.chart-wrap{flex:1;position:relative;min-height:0;display:none;overflow:hidden}  /* 默认隐藏 */
/* ===== 图表容器激活时显示 ===== */
.chart-wrap.active{display:block}  /* 激活时显示 */
/* ===== 热力图容器：允许纵向和横向滚动 ===== */
#heatmapWrap{overflow-y:auto;overflow-x:auto}
/* ===== 趋势分析容器：允许纵向滚动 ===== */
#trendWrap{overflow-y:auto}
/* ===== 趋势分析卡片样式 ===== */
.trend-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;margin:8px 14px;display:flex;align-items:center;gap:16px;transition:all .2s}
.trend-card:hover{border-color:#58a6ff;background:#1c2333}
.trend-rank{font-size:20px;font-weight:700;color:#58a6ff;min-width:36px;text-align:center}
.trend-info{flex:1;min-width:0}
.trend-name{font-size:14px;font-weight:600;color:#c9d1d9;margin-bottom:4px}
.trend-indicators{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:#8b949e}
.trend-indicators span{background:#21262d;padding:2px 6px;border-radius:3px}
.trend-score-wrap{text-align:center;min-width:80px}
.trend-score{font-size:28px;font-weight:700;line-height:1}
.trend-signal{font-size:11px;margin-top:4px;padding:2px 8px;border-radius:3px;font-weight:600}
.trend-summary{display:flex;gap:12px;padding:10px 14px;flex-wrap:wrap}
.trend-summary-item{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 14px;text-align:center;min-width:80px}
.trend-summary-item .num{font-size:20px;font-weight:700}
.trend-summary-item .label{font-size:10px;color:#8b949e;margin-top:2px}
/* ===== 图表标题（左上角悬浮文字） ===== */
.chart-title{position:absolute;top:4px;left:14px;color:#8b949e;font-size:11px;z-index:1}
/* ===== 时间范围选择按钮样式 ===== */
.range-btn{background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:3px;padding:2px 8px;font-size:10px;cursor:pointer;transition:all .2s}
.range-btn:hover{background:#30363d;color:#c9d1d9}
.range-btn.active{background:#1f6feb;color:#fff;border-color:#1f6feb}
</style>
</head>
<body>
<!-- ===== 顶部工具栏区域 ===== -->
<div class="hdr">
  <span>📊 行业资金流向</span>          <!-- 页面标题文字 -->
  <!-- 按钮2：刷新分时数据（蓝色） -->
  <button id="btnRefreshIntraday" class="btn-blue" onclick="doRefreshIntraday()">🔄 刷新分时数据</button>
  <!-- 按钮3：将分时数据合并到每日（绿色） -->
  <button id="btnMerge" class="btn-green" onclick="doMergeIntraday()">🔀 将分时数据更新到每日</button>
  <div class="sep"></div>               <!-- 竖线分隔 -->
  <!-- 状态显示文字 -->
  <span class="st" id="stDaily">每日: 加载中…</span>     <!-- 每日数据状态 -->
  <span class="st" id="stIntraday">分时: 加载中…</span>  <!-- 分时数据状态 -->
</div>
<!-- ===== Tab切换栏 ===== -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('daily')">📈 每日净流入</div>   <!-- Tab1：每日图表 -->
  <div class="tab" onclick="switchTab('intraday')">📉 当天分时</div>         <!-- Tab2：分时图表 -->
  <div class="tab" onclick="switchTab('heatmap')">📊 资金热力图</div>        <!-- Tab3：热力图 -->
  <div class="tab" onclick="switchTab('trend')">🔮 趋势分析</div>            <!-- Tab4：趋势分析 -->
</div>
<!-- ===== 图表1：每日净流入 ===== -->
<div class="chart-wrap active" id="dailyWrap">
  <div class="chart-title" id="dailyChartTitle">每日净流入(亿元) · 近1个月</div>
  <!-- 时间范围选择按钮组（移到工具栏下方） -->
  <div id="rangeBtnWrap" style="position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;background:#161b22;padding:6px 12px;border-radius:6px;border:1px solid #30363d;">
    <button class="range-btn active" data-days="30">近1月</button>
    <button class="range-btn" data-days="60">近2月</button>
    <button class="range-btn" data-days="90">近3月</button>
    <button class="range-btn" data-days="180">近半年</button>
    <button class="range-btn" data-days="365">近1年</button>
    <button class="range-btn" data-days="730">近2年</button>
    <button class="range-btn" data-days="1095">近3年</button>
  </div>
  <label style="position:absolute;top:4px;right:80px;z-index:2;color:#8b949e;font-size:11px;cursor:pointer">
    <input type="checkbox" id="selectAllDaily" checked> 全选
  </label>
  <div id="chartDaily" style="width:100%;height:100%"></div>
</div>
<!-- ===== 图表2：当天分时净流入 ===== -->
<div class="chart-wrap" id="intradayWrap">
  <div class="chart-title">当天分时净流入(亿元)</div>
  <label style="position:absolute;top:4px;right:80px;z-index:2;color:#8b949e;font-size:11px;cursor:pointer">
    <input type="checkbox" id="selectAllIntraday" checked> 全选
  </label>
  <div id="chartIntraday" style="width:100%;height:100%"></div>
</div>
<!-- ===== 图表3：资金热力图 ===== -->
<div class="chart-wrap" id="heatmapWrap">
  <div class="chart-title" id="heatmapChartTitle">资金热力图(亿元) · 近1个月</div>
  <!-- 时间范围选择按钮组 -->
  <div id="heatmapRangeBtnWrap" style="position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;background:#161b22;padding:6px 12px;border-radius:6px;border:1px solid #30363d;">
    <button class="range-btn" data-heatmap-days="3">近3日</button>
    <button class="range-btn" data-heatmap-days="5">近5日</button>
    <button class="range-btn" data-heatmap-days="10">近10日</button>
    <button class="range-btn" data-heatmap-days="20">近20日</button>
    <button class="range-btn active" data-heatmap-days="30">近1月</button>
    <button class="range-btn" data-heatmap-days="90">近3月</button>
    <button class="range-btn" data-heatmap-days="180">近半年</button>
    <button class="range-btn" data-heatmap-days="365">近1年</button>
  </div>
  <!-- 排序按钮 -->
  <div style="position:absolute;top:-4px;right:14px;z-index:10;display:flex;gap:6px;align-items:center;">
    <span style="color:#8b949e;font-size:10px;">排序:</span>
    <button class="range-btn active" id="sortBtnSum" onclick="sortHeatmap('sum')">累计净流入</button>
    <button class="range-btn" id="sortBtnName" onclick="sortHeatmap('name')">名称</button>
  </div>
  <div id="chartHeatmap" style="width:100%;height:100%;min-width:900px"></div>
</div>
<!-- ===== 图表4：趋势分析 ===== -->
<div class="chart-wrap" id="trendWrap">
  <div class="chart-title" id="trendChartTitle">🔮 趋势分析 · 近1个月</div>
  <!-- 时间范围选择按钮组 -->
  <div id="trendRangeBtnWrap" style="position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;background:#161b22;padding:6px 12px;border-radius:6px;border:1px solid #30363d;">
    <button class="range-btn active" data-trend-days="30">近1月</button>
    <button class="range-btn" data-trend-days="60">近2月</button>
    <button class="range-btn" data-trend-days="90">近3月</button>
    <button class="range-btn" data-trend-days="180">近半年</button>
  </div>
  <div id="trendContent" style="padding-top:36px;"></div>
</div>

<script>
// ==================== 初始化图表实例 ====================
// 获取DOM元素并创建ECharts实例（每个div一个独立图表）
const chartDaily = echarts.init(document.getElementById('chartDaily'));      // 每日图表
const chartIntraday = echarts.init(document.getElementById('chartIntraday')); // 分时图表
const chartHeatmap = echarts.init(document.getElementById('chartHeatmap'));  // 热力图图表

// ==================== 获取DOM元素引用 ====================
const stDaily = document.getElementById('stDaily');       // 每日状态文字元素
const stIntraday = document.getElementById('stIntraday'); // 分时状态文字元素
const btnRefreshIntraday = document.getElementById('btnRefreshIntraday'); // 分时刷新按钮

// ==================== 20种颜色（循环使用给20个行业） ====================
// const C=['#f23645','#ff7549','#ffa657','#53b483','#2b908f',  // 红/橙/绿/青系列
//          '#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef',  // 蓝/紫系列
//          '#06b6d4','#84cc16','#fbbf24','#fb923c','#34d399',  // 青/黄/绿系列
//          '#e879f9','#38bdf8','#a3e635','#fb7185','#818cf8']; // 粉/蓝/绿系列
const C = Array.from({length: 92}, (_, i) => {
    const hue = (i * 358 / 89) % 359;
    return `hsl(${hue}, 72%, 56%)`;
});

// ==================== Y轴固定范围（亿元） ====================
const Y_MIN = -300;  // Y轴下限
const Y_MAX = 430;   // Y轴上限


// ==================== Tab切换逻辑 ====================
/**
 * 切换每日/分时/热力图/趋势分析图表页面
 * name: 'daily' 或 'intraday' 或 'heatmap' 或 'trend'
 */
function switchTab(name) {
  // 更新Tab按钮样式
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));  // 移除所有active
  const tabs = document.querySelectorAll('.tab');  // 获取所有tab
  if (name === 'daily') tabs[0].classList.add('active');   // 激活第一个tab
  else if (name === 'intraday') tabs[1].classList.add('active');  // 激活第二个tab
  else if (name === 'heatmap') tabs[2].classList.add('active');   // 激活第三个tab
  else if (name === 'trend') tabs[3].classList.add('active');     // 激活第四个tab
  // 更新图表容器显示
  document.querySelectorAll('.chart-wrap').forEach(w => w.classList.remove('active'));  // 隐藏所有图表
  if (name === 'daily') document.getElementById('dailyWrap').classList.add('active');
  else if (name === 'intraday') document.getElementById('intradayWrap').classList.add('active');
  else if (name === 'heatmap') document.getElementById('heatmapWrap').classList.add('active');
  else if (name === 'trend') document.getElementById('trendWrap').classList.add('active');
  // 切换后需要resize图表（ECharts需要重新计算尺寸）
  setTimeout(() => { chartDaily.resize(); chartIntraday.resize(); chartHeatmap.resize(); }, 50);
  // 切换到热力图时自动加载数据
  if (name === 'heatmap' && !heatmapLoaded) {
    loadHeatmapData(currentHeatmapDays);
  }
  // 切换到趋势分析时自动加载数据
  if (name === 'trend' && !trendLoaded) {
    loadTrendData(currentTrendDays);
  }
}

// ==================== 通用图表配置生成 ====================
/**
 * 根据数据生成ECharts配置项
 * res: API返回的数据对象 {date, time_points, sectors}
 * yName: Y轴名称（如"净流入(亿元)"）
 * 返回: ECharts option对象 或 null（无数据时）
 */
function makeOption(res, yName) {
  if (!res || res.error || !res.sectors || res.sectors.length===0) return null;
  return {
    backgroundColor: '#0d1117',
    tooltip: {trigger:'axis', backgroundColor:'#1c2333', borderColor:'#30363d',
              textStyle:{color:'#c9d1d9',fontSize:11},
              enterable:true,
              confine:true,
              formatter: function(params) {
                if (!params || params.length === 0) return '';
                var title = '<b style="color:#58a6ff">' + params[0].axisValue + '</b><br>';
                var items = params.map(function(p) {
                  var val = Array.isArray(p.value) ? p.value[1] : p.value;
                  var sign = val > 0 ? '+' : '';
                  return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + p.color + ';margin-right:4px;vertical-align:middle"></span>' +
                    p.seriesName + ': ' + sign + Number(val).toFixed(2) + '<br>';
                }).join('');
                return '<div style="max-height:180px;overflow-y:auto;">' + title + items + '</div>';
              }},
    legend: {data: res.sectors.map(s=>s.name), textStyle:{color:'#8b949e',fontSize:10,fixed:true},
             top:68, right:8, width:'15%', type:'plain',
             icon:'circle', itemWidth:8, itemHeight:8, itemGap:4,
             formatter: function(name) {
               // 每行固定3个，每列按8个字宽度对齐，不够8个字后面补全角空格
               var s = name.length > 8 ? name.substring(0,8) : name;
               while (s.length < 8) s += '\u3000';  // 全角空格，宽度等于一个汉字
               return s;
             }},
    grid: {left:'16px',right:'20%',bottom:'16px',top:68,containLabel:true},
    xAxis: {type:'category', data:res.time_points,
            axisLine:{lineStyle:{color:'#30363d'}}, axisLabel:{color:'#8b949e',fontSize:10}},
    yAxis: {type:'value', name:yName, min:Y_MIN, max:Y_MAX,
            nameTextStyle:{color:'#8b949e',fontSize:10},
            axisLine:{lineStyle:{color:'#30363d'}}, axisLabel:{color:'#8b949e',fontSize:10},
            splitLine:{lineStyle:{color:'#21262d'}}},
    series: res.sectors.map((s,i)=>({
      name:s.name,
      type:'line',
      smooth:true,
      symbol:'circle',
      symbolSize:4,
      lineStyle:{width:1.5,color:C[i%C.length]},
      itemStyle:{color:C[i%C.length]},
      connectNulls: true,
      data: s.values.map((v,t)=>[res.time_points[t], v])
    }))
  };
}

// ==================== 渲染每日图表 ====================
function renderDaily(res) {
  if (res.error) { stDaily.textContent = '每日: ' + res.error; return; }
  
  // 根据 deleted_dates 剔除被删除的日期
  // 只剔除那些被用户主动删除的日期，其他日期（包括值为0的正常日期）保留
  const deletedSet = new Set(res.deleted_dates || []);
  
  // 找出需要保留的日期索引
  const validIndices = [];
  for (let t = 0; t < res.time_points.length; t++) {
    const dateStr = res.time_points[t];
    // 只剔除被标记为已删除的日期
    if (!deletedSet.has(dateStr)) {
      validIndices.push(t);
    }
  }
  
  // 构建过滤后的数据
  const filteredRes = {
    date: res.date,
    time_points: validIndices.map(i => res.time_points[i]),
    sectors: res.sectors.map(s => ({
      name: s.name,
      values: validIndices.map(i => s.values[i])
    }))
  };
  
  stDaily.textContent = '每日: ' + filteredRes.date + ' (' + filteredRes.time_points.length + '天)';
  
  const opt = makeOption(filteredRes, '净流入(亿元)');
  if (opt) {
    chartDaily.setOption(opt, true);
    bindSelectAll(chartDaily, 'selectAllDaily');
  }
}

// ==================== 渲染分时图表 ====================
/**
 * 将API返回的分时数据渲染到分时图表
 * res: {date, time_points: ["10:03",...], sectors: [{name, values},...]}
 */
function renderIntraday(res, animate) {
  if (!res || res.error) { stIntraday.textContent = '分时: 暂无数据'; return; }
  // 计算已采集的点数（第一个行业中非零值的个数）
  const filled = res.sectors && res.sectors.length > 0
    ? res.sectors[0].values.filter(v => v !== 0).length : 0;
  // 更新状态文字：显示采集进度
  stIntraday.textContent = `分时: ${filled} 点已采集`;
  const opt = makeOption(res, '净流入(亿元)');  // 生成图表配置
  if (!opt) return;
  if (animate) {
    // 动画重绘：逐步画出曲线，从左到右慢慢展开
    _intradayAnimating = true;                     // 标记动画进行中
    chartIntraday.clear();                         // 彻底清空图表
    // 先设置完整配置（坐标轴、图例等），数据为空
    const emptyOpt = JSON.parse(JSON.stringify(opt));  // 深拷贝
    emptyOpt.series = opt.series.map(s => ({...s, data: []}));  // 清空数据
    // 修复：JSON序列化会丢失formatter函数，需要手动恢复
    if (opt.legend && opt.legend.formatter) {
      emptyOpt.legend.formatter = opt.legend.formatter;
    }
    chartIntraday.setOption(emptyOpt, true);         // 设置框架（不合并）
    const totalPoints = res.time_points.length;    // 总点数
    const duration = 5000;                         // 5秒画完
    const interval = 50;                           // 每50ms画一批
    const batchSize = Math.max(1, Math.ceil(totalPoints / (duration / interval)));  // 每批画几个点
    let currentIdx = 0;                            // 当前画到第几个点
    const timer = setInterval(() => {
      currentIdx += batchSize;                     // 前进一批
      if (currentIdx >= totalPoints) {
        currentIdx = totalPoints;                  // 画完全部
        clearInterval(timer);                      // 停止定时器
        _intradayAnimating = false;                // 标记动画结束
        bindSelectAll(chartIntraday, 'selectAllIntraday');
      }
      // 只更新series数据（合并模式，不影响坐标轴）
      const seriesUpdate = res.sectors.map((s, i) => ({
        data: s.values.slice(0, currentIdx).map((v, t) => [res.time_points[t], v])
      }));
      chartIntraday.setOption({series: seriesUpdate}, false);  // 合并模式更新
    }, interval);
  } else {
    chartIntraday.setOption(opt, true);              // 替换模式渲染
    chartIntraday.resize();
    bindSelectAll(chartIntraday, 'selectAllIntraday');
  }
}

let _intradayAnimating = false;  // 分时动画进行中标志

function bindSelectAll(chart, checkboxId) {
  const checkbox = document.getElementById(checkboxId);
  if (!checkbox) return;
  
  checkbox.addEventListener('change', function() {
    if (this.checked) {
      chart.dispatchAction({ type: 'legendSelectAll' });
    } else {
      chart.dispatchAction({ type: 'legendInverseSelect' });
    }
  });
  
  chart.on('legendselectchanged', function() {
    const option = chart.getOption();
    const legend = option.legend && option.legend[0];
    if (!legend || !legend.selected) return;
    const selected = legend.selected;
    const allSelected = Object.values(selected).every(v => v === true);
    checkbox.checked = allSelected;
  });
}
// ==================== 按钮操作：刷新分时数据 ====================
/**
 * 点击“🔄 刷新分时数据”按钮触发
 * 重新读取数据库并更新当前时间点的资金净流入
 */
function doRefreshIntraday() {
  if (_intradayAnimating) {                         // 动画进行中
    stIntraday.textContent = '分时: 正在更新中...';  // 提示
    return;                                         // 不做任何处理
  }
  btnRefreshIntraday.disabled = true;               // 禁用按钮
  stIntraday.textContent = '分时: 刷新中...';
  switchTab('intraday');                             // 自动切换到分时Tab
  fetch('/api/intraday/refresh', {method:'POST'})   // POST请求刷新API
    .then(r=>r.json())
    .then(j=>{
      if (j.error) { stIntraday.textContent = '分时: ' + j.error; return; }
      renderIntraday(j, true);                       // 渲染图表（带动画）
      stIntraday.textContent = '分时: 已刷新 (' + j.time_points.length + '点)';
    })
    .catch(e=>{stIntraday.textContent='分时: 请求失败'})
    .finally(()=>btnRefreshIntraday.disabled=false);
}

// ==================== 按钮操作：将分时数据合并到每日 ====================
/**
 * 点击"🔀 将分时数据合并到每日"按钮触发
 * 将分时最新数据滑入每日数据（丢弃最远一天）
 */
function doMergeIntraday() {
  const btn = document.getElementById('btnMerge');  // 获取合并按钮
  btn.disabled = true;                              // 禁用按钮
  stDaily.textContent = '每日: 合并中...';          // 显示合并状态
  fetch('/api/daily/merge_intraday', {method:'POST'})  // POST请求合并API
    .then(r=>r.json())
    .then(j=>{
      if (j.error) {                                // 合并失败
        stDaily.textContent = '每日: ' + j.error;
      } else {                                      // 合并成功
        renderDaily(j);                             // 渲染更新后的每日图表
        stDaily.textContent = '每日: 已合并分时数据 (' + j.time_points.length + '天)';
      }
    })
    .catch(e=>{stDaily.textContent='每日: 合并失败'})  // 网络错误
    .finally(()=>btn.disabled=false);               // 恢复按钮
}

// ==================== 每日图表双击删除节点 ====================
chartDaily.on('dblclick', function(params) {
    if (!params || !params.data) return;
    const pointDate = params.name;
    
    if (!confirm(`确定要删除 ${pointDate} 这一天的数据吗？删除后将永久消失。`)) {
        return;
    }
    
    fetch(`/api/daily/delete_point?date=${encodeURIComponent(pointDate)}`)
    .then(r => {
        if (!r.ok) {
            return r.json().then(j => { throw new Error(j.error || '删除失败'); });
        }
        return r.json();
    })

        stDaily.textContent = '每日: 已删除 ' + pointDate + ' 的数据';
    })
    .catch(e => {
        alert('删除失败: ' + e.message);
    });

// ==================== 热力图相关变量 ====================
let currentHeatmapDays = 30;   // 当前热力图时间范围
let heatmapLoaded = false;     // 是否已加载过热力图数据
let heatmapRawData = null;     // 原始API返回数据（用于排序切换）
let heatmapSortMode = 'sum';   // 排序模式：'sum' 或 'name'

// ==================== 加载热力图数据 ====================
function loadHeatmapData(days) {
  currentHeatmapDays = days;
  document.getElementById('heatmapChartTitle').textContent = '资金热力图(亿元) · 加载中...';
  fetch(`/api/heatmap/${days}`)
    .then(r => r.json())
    .then(j => {
      if (j.error) {
        document.getElementById('heatmapChartTitle').textContent = '资金热力图: ' + j.error;
        return;
      }
      heatmapRawData = j;
      heatmapLoaded = true;
      renderHeatmap(j, heatmapSortMode);
    })
    .catch(e => {
      document.getElementById('heatmapChartTitle').textContent = '资金热力图: 加载失败';
    });
}

// ==================== 渲染热力图 ====================
function renderHeatmap(data, sortMode) {
  if (!data || !data.dates || !data.sectors) return;
  
  const titleMap = {3:'近3日',5:'近5日',10:'近10日',20:'近20日',30:'近1个月',90:'近3个月',180:'近半年',365:'近1年'};
  document.getElementById('heatmapChartTitle').textContent = '资金热力图(亿元) · ' + (titleMap[currentHeatmapDays] || currentHeatmapDays+'天');
  
  // 计算每个行业的累计净流入
  let sectorsWithSum = data.sectors.map(s => {
    const sum = s.values.reduce((a, b) => a + b, 0);
    return { name: s.name, values: s.values, sum: sum };
  });
  
  // 排序
  if (sortMode === 'sum') {
    sectorsWithSum.sort((a, b) => b.sum - a.sum);  // 累计净流入降序
  } else {
    sectorsWithSum.sort((a, b) => a.name.localeCompare(b.name, 'zh'));  // 名称排序
  }
  
  const sectorNames = sectorsWithSum.map(s => s.name);
  const dates = data.dates;
  
  // 构建热力图数据 [日期索引, 行业索引, 值]
  const heatmapData = [];
  let maxVal = 0;
  let maxSum = 0;
  for (let y = 0; y < sectorsWithSum.length; y++) {
    for (let x = 0; x < dates.length; x++) {
      const val = sectorsWithSum[y].values[x] || 0;
      heatmapData.push([x, y, val]);
      if (Math.abs(val) > maxVal) maxVal = Math.abs(val);
    }
    if (Math.abs(sectorsWithSum[y].sum) > maxSum) maxSum = Math.abs(sectorsWithSum[y].sum);
  }
  
  // 确保 maxVal 不为0
  if (maxVal === 0) maxVal = 1;
  if (maxSum === 0) maxSum = 1;
  
  // 合计柱状图数据
  const sumBarData = sectorsWithSum.map(s => s.sum);
  
  const option = {
    backgroundColor: '#0d1117',
    tooltip: {
      confine: true,
      position: function(point, params, dom, rect, size) {
        if (params && params.data && params.data[1] !== undefined && params.data[1] < 5) {
          return [point[0] - size.contentSize[0] / 2, point[1] + 10];
        }
        return [point[0] - size.contentSize[0] / 2, point[1] - size.contentSize[1] - 10];
      },
      backgroundColor: '#1c2333',
      borderColor: '#30363d',
      textStyle: { color: '#c9d1d9', fontSize: 11 },
      formatter: function(p) {
        if (p.seriesType === 'bar') {
          const sector = sectorNames[p.dataIndex];
          const val = p.value;
          const sign = val > 0 ? '+' : '';
          const color = val > 0 ? '#ff4d4f' : val < 0 ? '#00c853' : '#8b949e';
          return '<b style="color:#58a6ff">' + sector + '</b><br>' +
                 '合计: <span style="color:' + color + '">' + sign + val.toFixed(2) + ' 亿</span>';
        }
        const date = dates[p.data[0]];
        const sector = sectorNames[p.data[1]];
        const val = p.data[2];
        const sign = val > 0 ? '+' : '';
        const color = val > 0 ? '#ff4d4f' : val < 0 ? '#00c853' : '#8b949e';
        return '<b style="color:#58a6ff">' + sector + '</b><br>' +
               date + ': <span style="color:' + color + '">' + sign + val.toFixed(2) + ' 亿</span>';
      }
    },
    grid: [
      { top: 40, bottom: 60, left: 100, right: '18%' },
      { top: 40, bottom: 60, right: 10, width: '14%' }
    ],
    xAxis: [
      {
        type: 'category',
        data: dates,
        gridIndex: 0,
        axisLine: { lineStyle: { color: '#30363d' } },
        axisLabel: {
          color: '#8b949e',
          fontSize: 9,
          rotate: dates.length > 60 ? 45 : 0,
          interval: dates.length > 60 ? Math.floor(dates.length / 15) : 0
        },
        splitArea: { show: false }
      },
      {
        type: 'value',
        gridIndex: 1,
        axisLine: { lineStyle: { color: '#30363d' } },
        axisLabel: { show: false },
        splitLine: { show: false },
        axisTick: { show: false }
      }
    ],
    yAxis: [
      {
        type: 'category',
        data: sectorNames,
        gridIndex: 0,
        axisLine: { lineStyle: { color: '#30363d' } },
        axisLabel: { color: '#8b949e', fontSize: 10, width: 80, overflow: 'truncate' },
        splitArea: { show: false }

      },
      {
        type: 'category',
        data: sectorNames,
        gridIndex: 1,
        axisLine: { show: false },
        axisLabel: { 
          show: true, 
          color: '#8b949e', 
          fontSize: 9,
          width: 60,
          overflow: 'truncate'
        },
        axisTick: { show: false },
        splitArea: { show: false }
      }
    ],
    visualMap: [
      {
        min: -maxVal,
        max: maxVal,
        calculable: true,
        orient: 'horizontal',
        left: 'center',
        bottom: 4,
        inRange: {
          color: ['#00c853', '#1b5e20', '#2e2e2e', '#b71c1c', '#ff1744']
        },
        textStyle: { color: '#8b949e', fontSize: 10 },
        text: ['流入', '流出'],
        itemWidth: 12,
        itemHeight: 120,
        seriesIndex: 0
      },
      {
        min: -maxSum,
        max: maxSum,
        show: false,
        inRange: {
          color: ['#00c853', '#1b5e20', '#2e2e2e', '#b71c1c', '#ff1744']
        },
        seriesIndex: 1
      }
    ],
    series: [
      {
        name: '净流入',
        type: 'heatmap',
        xAxisIndex: 0,
        yAxisIndex: 0,
        data: heatmapData,
        label: {
          show: dates.length <= 30 && sectorNames.length <= 30,
          fontSize: 8,
          color: '#c9d1d9',
          formatter: function(p) {
            const v = p.data[2];
            if (v === 0) return '';
            return v > 0 ? '+' + v.toFixed(0) : v.toFixed(0);
          }
        },
        emphasis: {
          itemStyle: {
            shadowBlur: 6,
            shadowColor: 'rgba(0,0,0,0.5)'
          }
        },
        itemStyle: {
          borderColor: '#0d1117',
          borderWidth: 1
        }
      },
      {
        name: '合计',
        type: 'bar',
        xAxisIndex: 1,
        yAxisIndex: 1,
        data: sumBarData,
        barWidth: '70%',
        label: {
          show: true,
          position: 'right',
          fontSize: 9,
          color: '#8b949e',
          formatter: function(p) {
            const v = p.value;
            if (v === 0) return '';
            const sign = v > 0 ? '+' : '';
            return sign + v.toFixed(0);
          }
        },
        itemStyle: {
          borderColor: '#0d1117',
          borderWidth: 1
        }
      }
    ]
  };
  // 动态计算图表高度：每个行业至少22px，确保90个行业都能显示且不重叠
  const minChartHeight = Math.max(400, sectorNames.length * 12 + 100);
  const chartDiv = document.getElementById('chartHeatmap');
  chartDiv.style.height = minChartHeight + 'px';
  chartHeatmap.resize();
  chartHeatmap.setOption(option, true);
}

// ==================== 热力图排序切换 ====================
function sortHeatmap(mode) {
  heatmapSortMode = mode;
  // 更新按钮样式
  document.getElementById('sortBtnSum').classList.toggle('active', mode === 'sum');
  document.getElementById('sortBtnName').classList.toggle('active', mode === 'name');
  // 重新渲染
  if (heatmapRawData) {
    renderHeatmap(heatmapRawData, mode);
  }
}

// ==================== 热力图时间范围按钮事件 ====================
document.querySelectorAll('[data-heatmap-days]').forEach(btn => {
  btn.addEventListener('click', function() {
    // 更新按钮样式（只更新热力图按钮）
    document.querySelectorAll('[data-heatmap-days]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    // 加载对应天数的数据
    const days = parseInt(this.dataset.heatmapDays);
    loadHeatmapData(days);
  });
});

// ==================== 趋势分析相关变量 ====================
let currentTrendDays = 30;   // 当前趋势分析时间范围
let trendLoaded = false;     // 是否已加载过趋势分析数据

// ==================== 加载趋势分析数据 ====================
function loadTrendData(days) {
  currentTrendDays = days;
  document.getElementById('trendChartTitle').textContent = '🔮 趋势分析 · 加载中...';
  document.getElementById('trendContent').innerHTML = '<div style="text-align:center;padding:40px;color:#8b949e;">⏳ 正在分析数据...</div>';
  fetch(`/api/trend/analysis/${days}`)
    .then(r => r.json())
    .then(j => {
      if (j.error) {
        document.getElementById('trendChartTitle').textContent = '🔮 趋势分析: ' + j.error;
        document.getElementById('trendContent').innerHTML = '<div style="text-align:center;padding:40px;color:#f85149;">❌ ' + j.error + '</div>';
        return;
      }
      trendLoaded = true;
      renderTrend(j);
    })
    .catch(e => {
      document.getElementById('trendChartTitle').textContent = '🔮 趋势分析: 加载失败';
      document.getElementById('trendContent').innerHTML = '<div style="text-align:center;padding:40px;color:#f85149;">❌ 网络请求失败</div>';
    });
}

// ==================== 渲染趋势分析 ====================
function renderTrend(data) {
  if (!data || !data.sectors) return;
  
  const titleMap = {30:'近1个月',60:'近2个月',90:'近3个月',180:'近半年'};
  document.getElementById('trendChartTitle').textContent = '🔮 趋势分析 · ' + (titleMap[currentTrendDays] || currentTrendDays+'天') + ' (' + data.analysis_date + ')';
  
  const container = document.getElementById('trendContent');
  let html = '';
  
  // 1. 汇总统计卡片
  const summary = data.summary;
  html += '<div class="trend-summary">';
  html += '<div class="trend-summary-item"><div class="num" style="color:#ff1744">' + summary.strong_buy + '</div><div class="label">强烈买入</div></div>';
  html += '<div class="trend-summary-item"><div class="num" style="color:#ff5252">' + summary.buy + '</div><div class="label">建议买入</div></div>';
  html += '<div class="trend-summary-item"><div class="num" style="color:#ffc107">' + summary.hold + '</div><div class="label">观望</div></div>';
  html += '<div class="trend-summary-item"><div class="num" style="color:#4caf50">' + summary.sell + '</div><div class="label">建议减仓</div></div>';
  html += '<div class="trend-summary-item"><div class="num" style="color:#00c853">' + summary.strong_sell + '</div><div class="label">建议卖出</div></div>';
  html += '</div>';
  
  // 2. 说明文字
  html += '<div style="padding:4px 14px 8px;font-size:10px;color:#8b949e;">';
  html += '💡 评分基于资金流向动量、趋势强度(RSI)、均线排列、近期趋势等综合计算 | 仅供参考，不构成投资建议';
  html += '</div>';
  
  // 3. 行业卡片列表
  data.sectors.forEach((s, idx) => {
    const rank = idx + 1;
    const maStatus = s.ma_bullish ? '🟢多头' : (s.ma_bearish ? '🔴空头' : '⚪震荡');
    const trendDir = s.recent_trend > 0 ? '📈' : (s.recent_trend < 0 ? '📉' : '➡️');
    
    html += '<div class="trend-card">';
    // 排名
    html += '<div class="trend-rank">' + rank + '</div>';
    // 信息区
    html += '<div class="trend-info">';
    html += '<div class="trend-name">' + s.name + '</div>';
    html += '<div class="trend-indicators">';
    html += '<span>MA5: ' + s.ma5.toFixed(1) + '</span>';
    html += '<span>MA10: ' + s.ma10.toFixed(1) + '</span>';
    html += '<span>MA20: ' + s.ma20.toFixed(1) + '</span>';
    html += '<span>动量: ' + (s.momentum > 0 ? '+' : '') + s.momentum.toFixed(1) + '%</span>';
    html += '<span>RSI: ' + s.trend_strength.toFixed(0) + '</span>';
    html += '<span>波动: ' + s.volatility.toFixed(1) + '</span>';
    html += '<span>累计: ' + (s.total_inflow > 0 ? '+' : '') + s.total_inflow.toFixed(1) + '亿</span>';
    html += '<span>' + trendDir + ' 近5日: ' + (s.recent_trend > 0 ? '+' : '') + s.recent_trend.toFixed(1) + '</span>';
    html += '<span>' + maStatus + '</span>';
    // 新增指标
    var longTermColor = s.long_term_avg >= 0 ? '#ff5252' : '#00c853';
    html += '<span style="color:' + longTermColor + '">长期均值: ' + (s.long_term_avg > 0 ? '+' : '') + s.long_term_avg.toFixed(2) + '</span>';
    var slopeColor = s.slope >= 0 ? '#ff5252' : '#00c853';
    html += '<span style="color:' + slopeColor + '">趋势斜率: ' + (s.slope > 0 ? '+' : '') + s.slope.toFixed(3) + '</span>';
    html += '<span>流入率: ' + s.consistency.toFixed(0) + '%</span>';
    var accelColor = s.trend_accel >= 0 ? '#ff5252' : '#00c853';
    html += '<span style="color:' + accelColor + '">加速度: ' + (s.trend_accel > 0 ? '+' : '') + s.trend_accel.toFixed(2) + '</span>';
    html += '<span>历史分位: ' + s.percentile.toFixed(0) + '%</span>';
    html += '</div>';
    html += '</div>';
    // 评分和信号
    html += '<div class="trend-score-wrap">';
    html += '<div class="trend-score" style="color:' + s.signal_color + '">' + s.score.toFixed(0) + '</div>';
    html += '<div class="trend-signal" style="background:' + s.signal_color + '22;color:' + s.signal_color + '">' + s.signal + '</div>';
    html += '</div>';
    html += '</div>';
  });
  
  container.innerHTML = html;
}

// ==================== 趋势分析时间范围按钮事件 ====================
document.querySelectorAll('[data-trend-days]').forEach(btn => {
  btn.addEventListener('click', function() {
    // 更新按钮样式（只更新趋势分析按钮）
    document.querySelectorAll('[data-trend-days]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    // 加载对应天数的数据
    const days = parseInt(this.dataset.trendDays);
    loadTrendData(days);
  });
});
