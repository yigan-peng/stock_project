<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行业资金流向图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0d1117; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        #chart {
            width: 100%;
            height: 85vh;
        }
        .header {
            color: #c9d1d9;
            padding: 10px 16px 0;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status {
            font-size: 12px;
            color: #8b949e;
            font-weight: normal;
        }
        .legend-wrapper {
            padding: 4px 12px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .legend-item {
            display: inline-block;
            font-size: 11px;
            color: #8b949e;
            margin-right: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #161b22;
        }
        .legend-item.up { color: #f23645; }
        .legend-item.down { color: #00c853; }
    </style>
</head>
<body>
    <div class="header">
        <span>📊 行业资金流向</span>
        <span class="status" id="status">等待数据...</span>
    </div>
    <div id="chart"></div>

    <script>
        const chart = echarts.init(document.getElementById('chart'), null, {
            width: 'auto',
            height: 'auto'
        });

        // 存储每个板块的历史数据
        const sectorData = {};
        let currentOrder = [];
        let lastUpdateTime = Date.now();

        // 连接 WebSocket
        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${location.host}/ws`;
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('status').textContent = '🟢 实时连接中';
                document.getElementById('status').style.color = '#00c853';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.length === 0) {
                    document.getElementById('status').textContent = '⏸ 非交易时间';
                    document.getElementById('status').style.color = '#ff9800';
                    return;
                }

                const now = Date.now();
                lastUpdateTime = now;

                // 更新状态
                const date = new Date();
                const timeStr = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}:${String(date.getSeconds()).padStart(2,'0')}`;
                document.getElementById('status').textContent = `🟢 ${timeStr}`;
                document.getElementById('status').style.color = '#00c853';

                // 更新数据
                data.forEach(item => {
                    if (!sectorData[item.name]) {
                        sectorData[item.name] = [];
                    }
                    // 只保留最近200个数据点，防止内存溢出
                    if (sectorData[item.name].length > 300) {
                        sectorData[item.name].shift();
                    }
                    sectorData[item.name].push([now, item.net / 100000000]); // 转为亿元
                });

                // 保持排序一致
                currentOrder = data.map(d => d.name);

                updateChart();
            };

            ws.onclose = () => {
                document.getElementById('status').textContent = '🔴 连接断开，3秒后重连...';
                document.getElementById('status').style.color = '#f23645';
                setTimeout(connect, 3000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        function updateChart() {
            const colors = [
                '#f23645', '#ff7549', '#ffa657', '#ffcd70',
                '#89d185', '#53b483', '#2b908f', '#3b82f6',
                '#6366f1', '#8b5cf6', '#a855f7', '#d946ef'
            ];

            // 构建 series
            const series = currentOrder.map((name, index) => {
                const data = sectorData[name] || [];
                const colorIndex = index % colors.length;
                return {
                    name: name,
                    type: 'line',
                    stack: 'total',
                    smooth: true,
                    symbol: 'none',
                    lineStyle: { width: 1.5 },
                    areaStyle: {
                        opacity: 0.6,
                        color: data.length > 0 && data[data.length-1][1] >= 0 
                            ? colors[colorIndex] 
                            : '#374151'
                    },
                    data: data
                };
            });

            const option = {
                backgroundColor: '#0d1117',
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' },
                    backgroundColor: '#1c2333',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9', fontSize: 12 }
                },
                legend: {
                    data: currentOrder,
                    textStyle: { color: '#8b949e', fontSize: 10 },
                    top: 40,
                    type: 'scroll',
                    pageIconColor: '#30363d',
                    pageIconInactiveColor: '#21262d',
                    pageTextStyle: { color: '#8b949e' }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'time',
                    axisLine: { lineStyle: { color: '#30363d' } },
                    axisLabel: { color: '#8b949e', fontSize: 10 },
                    splitLine: { show: false }
                },
                yAxis: {
                    type: 'value',
                    name: '净流入 (亿元)',
                    nameTextStyle: { color: '#8b949e', fontSize: 10 },
                    axisLine: { lineStyle: { color: '#30363d' } },
                    axisLabel: { color: '#8b949e', fontSize: 10 },
                    splitLine: { lineStyle: { color: '#21262d' } }
                },
                series: series
            };

            chart.setOption(option, true);
        }

        // 窗口大小变化时自适应
        window.addEventListener('resize', () => {
            chart.resize();
        });

        // 启动连接
        connect();
    </script>
</body>
</html>
